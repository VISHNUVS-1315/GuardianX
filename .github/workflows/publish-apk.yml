name: Publish GuardianX APK

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-apk.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter runners
        run: >
          flutter create .
          --project-name guardianx_app
          --org com.guardianx
          --platforms=android,web

      - name: Configure Android permissions
        run: dart run tool/configure_android.dart

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete guardianx-latest --cleanup-tag -y || true
          gh release create guardianx-latest \
            build/app/outputs/flutter-apk/app-debug.apk#GuardianX.apk \
            --title "GuardianX Latest APK" \
            --notes "Latest GuardianX Android APK with adaptive light/dark mode and red emergency actions."
