name: CampusLive Hierarchy APK

on:
  push:
    branches:
      - campuslive-hierarchy-live
    paths:
      - "campuslive_hierarchy_flutter/**"
      - ".github/workflows/campuslive-hierarchy-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify backend
        shell: bash
        run: |
          set -euo pipefail
          API="https://campuslive-hierarchy-api.onrender.com"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$API/health"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          cd campuslive_hierarchy_flutter
          cp -r lib /tmp/campuslive_hierarchy_lib
          cp pubspec.yaml /tmp/campuslive_hierarchy_pubspec.yaml
          cp analysis_options.yaml /tmp/campuslive_hierarchy_analysis.yaml
          flutter create . --platforms=android --org com.campuslive --project-name campuslive_hierarchy
          rm -rf lib
          cp -r /tmp/campuslive_hierarchy_lib lib
          cp /tmp/campuslive_hierarchy_pubspec.yaml pubspec.yaml
          cp /tmp/campuslive_hierarchy_analysis.yaml analysis_options.yaml
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()
          text = text.replace(
              'applicationId = "com.campuslive.campuslive_hierarchy"',
              'applicationId = "com.campuslive.hierarchy"',
          )
          gradle.write_text(text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in text:
              pos = text.find(">")
              text = text[:pos + 1] + "\n    " + permission + text[pos + 1:]
          text = text.replace(
              'android:label="campuslive_hierarchy"',
              'android:label="CampusLive"',
          )
          manifest.write_text(text)
          PY
          flutter pub get

      - name: Analyze
        shell: bash
        run: |
          cd campuslive_hierarchy_flutter
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd campuslive_hierarchy_flutter
          flutter build apk --release
          mkdir -p ../hierarchy_apk_output
          cp build/app/outputs/flutter-apk/app-release.apk ../hierarchy_apk_output/CampusLive-Hierarchy.apk
          sha256sum ../hierarchy_apk_output/CampusLive-Hierarchy.apk > ../hierarchy_apk_output/SHA256.txt
          unzip -t ../hierarchy_apk_output/CampusLive-Hierarchy.apk >/dev/null
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs ../hierarchy_apk_output/CampusLive-Hierarchy.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging ../hierarchy_apk_output/CampusLive-Hierarchy.apk | head -n 8

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusLive-Hierarchy-APK
          path: hierarchy_apk_output/*
          if-no-files-found: error
          retention-days: 30
