name: CampusLive Hierarchy APK

on:
  push:
    branches:
      - campuslive-hierarchy-live
    paths:
      - "campuslive_hierarchy_app/**"
      - ".github/workflows/campuslive-hierarchy-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Backend health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
            https://campuslive-hierarchy-api.onrender.com/health

      - name: Generate Android runner
        shell: bash
        run: |
          set -euo pipefail
          cd campuslive_hierarchy_app
          cp lib/main.dart /tmp/hierarchy_main.dart
          cp pubspec.yaml /tmp/hierarchy_pubspec.yaml
          cp analysis_options.yaml /tmp/hierarchy_analysis.yaml
          flutter create . --platforms=android --org com.campuslive --project-name campuslive_hierarchy
          cp /tmp/hierarchy_main.dart lib/main.dart
          cp /tmp/hierarchy_pubspec.yaml pubspec.yaml
          cp /tmp/hierarchy_analysis.yaml analysis_options.yaml
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("android/app/build.gradle.kts")
          s = gradle.read_text()
          s = s.replace('applicationId = "com.campuslive.campuslive_hierarchy"', 'applicationId = "com.campuslive.hierarchy"')
          gradle.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in m:
              pos = m.find(">")
              m = m[:pos+1] + "\n    " + permission + m[pos+1:]
          m = m.replace('android:label="campuslive_hierarchy"', 'android:label="CampusLive"')
          manifest.write_text(m)
          PY
          flutter pub get

      - name: Analyze
        shell: bash
        run: |
          cd campuslive_hierarchy_app
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd campuslive_hierarchy_app
          flutter build apk --release
          mkdir -p ../hierarchy_apk_output
          cp build/app/outputs/flutter-apk/app-release.apk ../hierarchy_apk_output/CampusLive-Hierarchy.apk
          sha256sum ../hierarchy_apk_output/CampusLive-Hierarchy.apk > ../hierarchy_apk_output/SHA256.txt
          unzip -t ../hierarchy_apk_output/CampusLive-Hierarchy.apk >/dev/null
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs ../hierarchy_apk_output/CampusLive-Hierarchy.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging ../hierarchy_apk_output/CampusLive-Hierarchy.apk | head -n 6

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusLive-Hierarchy-APK
          path: hierarchy_apk_output/*
          if-no-files-found: error
          retention-days: 30
