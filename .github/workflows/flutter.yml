name: GuardianX Flutter CI

on:
  push:
    branches: ["main", "guardianx-rebuild", "rebuild/**"]
  pull_request:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Check backend syntax
        run: node --check backend/server.js

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter runners
        run: >
          flutter create .
          --project-name guardianx_app
          --org com.guardianx
          --platforms=android,web

      - name: Configure Android permissions
        run: dart run tool/configure_android.dart

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build web
        run: flutter build web --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GuardianX-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
