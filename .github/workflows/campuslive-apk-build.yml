name: CampusLive Android APKs

on:
  push:
    branches: [campuslive-apk-build]
    paths:
      - 'campuslive_android/**'
      - '.github/workflows/campuslive-apk-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'campuslive_android/**'
      - '.github/workflows/campuslive-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create demo signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CampusLive Demo,O=CampusLive,C=IN"

      - name: Build Student and Admin APKs
        shell: bash
        run: |
          set -euo pipefail
          cd campuslive_android
          gradle --no-daemon clean assembleStudentRelease assembleAdminRelease

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp campuslive_android/app/build/outputs/apk/student/release/app-student-release.apk dist/CampusLive.apk
          cp campuslive_android/app/build/outputs/apk/admin/release/app-admin-release.apk dist/CampusLive-Admin.apk
          unzip -t dist/CampusLive.apk >/dev/null
          unzip -t dist/CampusLive-Admin.apk >/dev/null
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: CampusLive-APKs
          path: dist/*
          if-no-files-found: error
          retention-days: 30
