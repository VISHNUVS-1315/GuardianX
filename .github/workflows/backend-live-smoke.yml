name: GuardianX Live Backend Smoke Test

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-live-smoke.yml"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: https://guardianx-api-391z.onrender.com

    steps:
      - name: Wait for current Render version and verify health
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..18}; do
            if response=$(curl -fsS --max-time 10 "$API_URL/health"); then
              if echo "$response" | jq -e '.ok == true and .status == "live" and .version == "1.0.1"' >/dev/null; then
                echo "Health endpoint OK on version 1.0.1"
                break
              fi
            fi
            if [ "$i" -eq 18 ]; then
              echo "Current backend version did not become healthy"
              exit 1
            fi
            sleep 10
          done

      - name: Verify status endpoint and dry-run capability
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS --max-time 10 "$API_URL/api/status")
          echo "$response" | jq -e '.ok == true and .capabilities.incidentIntake == true and .capabilities.incidentDryRunValidation == true' >/dev/null
          echo "Status endpoint OK"

      - name: Verify incident intake with dry run
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS --max-time 10 \
            -H 'Content-Type: application/json' \
            -H 'X-GuardianX-Client: github-live-smoke' \
            -d '{"type":"manual_help","location":{"latitude":0.0,"longitude":0.0,"accuracy":1.0},"dryRun":true}' \
            "$API_URL/api/incidents")
          echo "$response" | jq -e '.ok == true and .dryRun == true and .validated == true' >/dev/null
          echo "Incident dry-run endpoint OK"
