name: CampusLive Flutter APK

on:
  pull_request:
    branches:
      - main
    paths:
      - "campuslive_flutter/**"
      - ".github/workflows/campuslive-flutter-mobile.yml"
  push:
    branches:
      - campuslive-fullstack
    paths:
      - "campuslive_flutter/**"
      - ".github/workflows/campuslive-flutter-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        shell: bash
        run: |
          set -euo pipefail
          cd campuslive_flutter
          cp lib/main.dart /tmp/campuslive_main.dart
          cp pubspec.yaml /tmp/campuslive_pubspec.yaml
          cp analysis_options.yaml /tmp/campuslive_analysis.yaml
          flutter create . --platforms=android --org com.campuslive --project-name campuslive
          cp /tmp/campuslive_main.dart lib/main.dart
          cp /tmp/campuslive_pubspec.yaml pubspec.yaml
          cp /tmp/campuslive_analysis.yaml analysis_options.yaml
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              s = s.replace("<manifest", "<manifest", 1)
              pos = s.find(">")
              s = s[:pos+1] + "\n    " + permission + s[pos+1:]
              p.write_text(s)
          PY
          flutter pub get

      - name: Analyze
        shell: bash
        run: |
          cd campuslive_flutter
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd campuslive_flutter
          flutter build apk --release
          mkdir -p ../apk_output
          cp build/app/outputs/flutter-apk/app-release.apk ../apk_output/CampusLive-Flutter.apk
          sha256sum ../apk_output/CampusLive-Flutter.apk > ../apk_output/SHA256.txt
          unzip -t ../apk_output/CampusLive-Flutter.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CampusLive-Flutter-APK
          path: apk_output/*
          if-no-files-found: error
          retention-days: 30
